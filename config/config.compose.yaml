# EdgeFlow configuration for docker compose: the shipped config.yaml with the service
# registry enabled and pointed at the "postgres" service.
# Unknown keys are rejected so that typos are caught at startup.

application:
  name: edgeflow
  environment: development   # development | staging | production
  log_level: info            # trace | debug | info | warn | error | critical | off

server:
  host: 0.0.0.0              # address to bind (IP literal or resolvable name)
  port: 8080                 # 1..65535
  request_timeout_ms: 5000   # 10..600000; time allowed to receive a request / write a response
  keep_alive_timeout_ms: 10000   # 10..600000; idle time before a keep-alive connection is closed
  max_request_body_bytes: 1048576   # 0..67108864 (default 1 MiB); larger bodies get 413
  max_header_bytes: 8192     # 1024..65536; larger headers get 431
  max_connections: 1024      # 1..100000; connections beyond this are closed immediately
  worker_threads: 2          # 1..64; threads running the asynchronous I/O loop

database:
  # Phase 3 service registry. PostgreSQL is the persistent source of service metadata.
  # Enabled for docker compose: startup connects, applies schema migrations, and fails if
  # the database is unreachable.
  enabled: true
  host: postgres             # PostgreSQL address (the Compose service name)
  port: 5432                 # 1..65535
  name: edgeflow             # database name
  user: edgeflow
  password_env: EDGEFLOW_DB_PASSWORD   # NAME of the environment variable holding the password; never put the password here
  pool_size: 4               # 1..64 connections; each in-flight registry request holds one
  connect_timeout_seconds: 5 # 1..60

shutdown:
  grace_period_seconds: 5    # 0..300; in-flight requests may finish within this time
