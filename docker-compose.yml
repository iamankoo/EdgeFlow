name: edgeflow

services:
  postgres:
    image: postgres:16
    container_name: edgeflow-postgres
    restart: "no"
    environment:
      POSTGRES_USER: edgeflow
      POSTGRES_DB: edgeflow
      # Development default only. Override it (and keep it out of Git) with
      #   EDGEFLOW_DB_PASSWORD=... docker compose up
      # or an untracked .env file. The same value is handed to EdgeFlow below.
      POSTGRES_PASSWORD: ${EDGEFLOW_DB_PASSWORD:-edgeflow_dev_password}
    volumes:
      # Named volume: the registry survives `docker compose down` and EdgeFlow restarts.
      # `docker compose down -v` deletes it.
      - edgeflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeflow -d edgeflow"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7
    container_name: edgeflow-redis
    restart: "no"
    # Cache and rate-limit state only: nothing is persisted, memory is bounded, and when the
    # limit is reached the keys closest to expiry go first (every key EdgeFlow writes expires).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
              "--maxmemory-policy", "volatile-ttl"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s

  edgeflow:
    build:
      context: .
    image: edgeflow:phase10
    container_name: edgeflow
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # The configuration names this variable (database.password_env); the password itself
      # is never written to a configuration file.
      EDGEFLOW_DB_PASSWORD: ${EDGEFLOW_DB_PASSWORD:-edgeflow_dev_password}
      # Used only when the configuration sets admin.token_env: EDGEFLOW_ADMIN_TOKEN.
      EDGEFLOW_ADMIN_TOKEN: ${EDGEFLOW_ADMIN_TOKEN:-}
    ports:
      # Published on the loopback interface only: the gateway starts with an open registry API, so
      # it is not offered to the network by default. To expose it deliberately:
      #   EDGEFLOW_BIND=0.0.0.0 docker compose up   (and set admin.token_env, see config.compose.yaml)
      # Host port is configurable: EDGEFLOW_HTTP_PORT=9000 docker compose up
      # The container port must equal server.port in the configuration (default 8080).
      - "${EDGEFLOW_BIND:-127.0.0.1}:${EDGEFLOW_HTTP_PORT:-8080}:8080"
    volumes:
      # The shipped configuration with the service registry enabled for the postgres service.
      - ./config/config.compose.yaml:/etc/edgeflow/config.yaml:ro
    # Must exceed shutdown.grace_period_seconds so a graceful stop is never killed.
    stop_grace_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Bounds against a runaway process (fork bomb, memory growth); measured use is ~17 MB and 17 threads.
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      - /tmp:size=16m,mode=1777
    # The image's HEALTHCHECK (edgeflow --healthcheck, i.e. GET /health) applies.

volumes:
  edgeflow-pgdata:
