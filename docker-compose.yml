name: edgeflow

services:
  edgeflow:
    build:
      context: .
    image: edgeflow:phase2
    container_name: edgeflow
    restart: "no"
    ports:
      # Host port is configurable: EDGEFLOW_HTTP_PORT=9000 docker compose up
      # The container port must equal server.port in config/config.yaml (default 8080).
      - "${EDGEFLOW_HTTP_PORT:-8080}:8080"
    volumes:
      - ./config/config.yaml:/etc/edgeflow/config.yaml:ro
    # Must exceed shutdown.grace_period_seconds so a graceful stop is never killed.
    stop_grace_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image's HEALTHCHECK (edgeflow --healthcheck, i.e. GET /health) applies.
